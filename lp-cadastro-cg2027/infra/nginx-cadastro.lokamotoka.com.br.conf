# Nginx · cadastro.lokamotoka.com.br (página estática)
# Ajuste caminhos/certificado ao padrão já usado na VPS (ex.: o de privacidade.lokamotoka.com.br).
# Se a VPS usa Caddy, o equivalente é:
#   cadastro.lokamotoka.com.br {
#     root * /var/www/cadastro.lokamotoka.com.br
#     file_server
#     header { X-Content-Type-Options nosniff; Referrer-Policy strict-origin-when-cross-origin; X-Frame-Options DENY }
#     log { output discard }
#   }

server {
    listen 80;
    server_name cadastro.lokamotoka.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cadastro.lokamotoka.com.br;

    ssl_certificate     /etc/letsencrypt/live/cadastro.lokamotoka.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cadastro.lokamotoka.com.br/privkey.pem;

    root /var/www/cadastro.lokamotoka.com.br;
    index index.html;

    # sem log de conteúdo; só erros
    access_log off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; }
}

